# ============================================================
#  Monitor de EPI - configuração
# ============================================================

# Câmeras monitoradas. Cada uma aparece num quadro da tela. "ativa: false" desliga sem apagar.
# Fonte do vídeo:
#   0                        -> webcam do PC
#   "videos/teste.mp4"       -> arquivo de vídeo
#   "rtsp://..."             -> câmera IP (Tapo: veja README, seção "Câmeras Tapo")
#
# Tapo: rtsp://${TAPO_USUARIO}:${TAPO_SENHA}@IP_DA_CAMERA:554/stream1
#   stream1 = alta resolução (melhor para detectar de longe) | stream2 = baixa (mais leve)
#   O usuário e a senha NÃO ficam aqui: ${TAPO_USUARIO} e ${TAPO_SENHA} são lidos do Windows
#   (setx TAPO_USUARIO "..." e setx TAPO_SENHA "..."), para não irem parar no GitHub.
cameras:
  - nome: "Câmera do PC"
    fonte: 0
    ativa: false

  - nome: "ALMOXARIFADO"
    fonte: "rtsp://${TAPO_USUARIO}:${TAPO_SENHA}@192.168.0.160:554/stream1"
    ativa: false   # ligar quando o PC estiver na rede MINAS NOVAS

  # App Tapo rodando no BlueStacks (emulador Android) neste PC: pega a câmera pela nuvem da Tapo,
  # de qualquer rede. Abra a câmera no app e deixe a janela do BlueStacks aberta (sem minimizar).
  # As 4 câmeras abaixo vêm da grade do app Tapo (seção "grades", mais abaixo). O programa
  # RECONHECE cada uma pela imagem (foto de referência em referencias/<nome>.jpg): se o app
  # reorganizar a grade, cada câmera é achada no novo quadrado sozinha.
  # Câmera nova na grade: python identificar_cameras.py --referencia "NOME" <quadrado 1-4>
  - nome: "ALMOXARIFADO"
    fonte: "grade:bluestacks"
    ativa: true

  - nome: "CÂMERA 2 - INTERNA"
    fonte: "grade:bluestacks"
    ativa: true

  - nome: "CÂMERA 3 - FACHADA"
    fonte: "grade:bluestacks"
    ativa: true

  - nome: "CÂMERA 4 - CORREDOR"
    fonte: "grade:bluestacks"
    ativa: true

  # TESTE: vídeo da Tapo rodando no celular, espelhado no PC (veja README, "Testar pelo celular")
  - nome: "ALMOXARIFADO (celular)"
    fonte: "janela:ApowerMirror Live"
    # corta a coluna de botões do app Tapo (8% da direita): [esquerda, topo, direita, base]
    recorte: [0, 0, 0.92, 1]
    ativa: false

  - nome: "Tapo 2"
    fonte: "rtsp://${TAPO_USUARIO}:${TAPO_SENHA}@192.168.0.101:554/stream1"
    ativa: false

# Grades: uma janela com várias câmeras (app Tapo no BlueStacks em visualização múltipla).
# "posicoes" são os quadrados da grade: [esquerda, topo, direita, base] em fração da janela.
# (medido com o BlueStacks em janela, com a coluna de anúncios à esquerda; se mudar o TAMANHO
#  da janela, as posições precisam ser refeitas - a ORDEM das câmeras pode mudar à vontade)
grades:
  bluestacks:
    fonte: "janela:BlueStacks App Player"
    intervalo_s: 5          # de quanto em quanto tempo confere quem está em cada quadrado
    posicoes:
      - [0.1546, 0.2057, 0.4250, 0.5143]   # 1: em cima, à esquerda
      - [0.4307, 0.2057, 0.7027, 0.5143]   # 2: em cima, à direita
      - [0.1546, 0.5249, 0.4250, 0.8335]   # 3: embaixo, à esquerda
      - [0.4307, 0.5249, 0.7027, 0.8335]   # 4: embaixo, à direita

modelo:
  # Onde a detecção roda:
  #   "roboflow" -> workflow na nuvem com o modelo público construction-site-safety/27
  #                 (não precisa treinar; precisa de internet e da chave ROBOFLOW_API_KEY)
  #   "local"    -> modelo .pt no próprio PC (sem internet; precisa treinar - ver README)
  motor: "roboflow"
  roboflow:
    workflow: "workflows/epi_workflow.json"
    url: "https://serverless.roboflow.com"
    # reduz a imagem antes de enviar. 640 = mais rápido; 1280 = mais preciso (no almoxarifado,
    # com 640 o modelo confundia latas com pessoa; com a resolução cheia, não)
    largura_envio: 1280
  # Pesos do modelo local (motor: "local")
  caminho: "modelos/epi.pt"
  confianca_minima: 0.40
  tamanho_imagem: 640
  # Nomes das classes do modelo -> significado para o sistema.
  # Já vem mapeado para o dataset "Construction Site Safety" e variações comuns.
  classes:
    pessoa: ["Person", "person"]
    capacete: ["Hardhat", "hardhat", "helmet", "Helmet"]
    colete: ["Safety Vest", "vest", "Vest", "safety-vest"]
    sem_capacete: ["NO-Hardhat", "no-hardhat", "no_helmet", "head"]
    sem_colete: ["NO-Safety Vest", "no-vest", "no_vest"]

regras:
  # EPIs obrigatórios nesta câmera (capacete, colete)
  epis_obrigatorios: ["capacete", "colete"]
  # Segundos seguidos sem o EPI até virar infração (evita alarme falso)
  tempo_minimo_s: 2.0
  # Depois de registrar, não registra a mesma pessoa de novo por este tempo (15 min)
  intervalo_repeticao_s: 900
  # Ignora pessoas muito pequenas/distantes (altura da caixa em pixels)
  altura_minima_pessoa_px: 80
  # "Sem EPI" detectado sem nenhuma pessoa por perto é ignorado (evita alarme falso em
  # objetos e telas). Deixe false só se o modelo não tiver a classe "pessoa".
  exigir_pessoa: true
  # true  = modo cauteloso:
  #         - só conta como pessoa se o modelo também viu algo que só gente tem: a cabeça (com ou
  #           sem capacete) ou um "sem EPI" em cima dela. Evita alarme em latas, tonéis, sacos.
  #         - "sem capacete" só se o modelo VIU a cabeça sem capacete (de lado/na borda ele às vezes
  #           não enxerga o capacete - isso não pode virar acusação).
  # false = qualquer "pessoa" detectada vale e EPI não encontrado = falta (pega mais, erra mais).
  confirmar_pela_cabeca: true
  # Confere pela COR o que o modelo disse da cabeça: "capacete" sem cor nenhuma (cabelo escuro)
  # vira "sem capacete"; "sem capacete" com cor viva (capacete verde, azul...) vira "capacete".
  # Corrige erros do modelo em imagem pequena (grade do app) e atrás da tela de proteção.
  verificar_cor_capacete: true

desempenho:
  # Analisa 1 a cada N quadros (CPU sem placa de vídeo: 2 a 4 é bom)
  processar_a_cada_n_quadros: 3
  # Câmera ao vivo: intervalo mínimo entre análises, POR CÂMERA. Com o Roboflow, cada análise
  # gasta 1 crédito (1 s = até 3.600 por hora por câmera); aumente para economizar.
  # 3 s por câmera: com 4 câmeras dá ~4.800 créditos/hora (antes, com 1 s, ~14.400)
  intervalo_minimo_analise_s: 3.0

alertas:
  som: true
  mostrar_janela: true

coleta:
  # Tira prints ORIGINAIS da câmera (sem caixas) para treinar o modelo próprio depois.
  # {AREA_DE_TRABALHO} = sua Área de Trabalho. Atenção: se ela estiver no OneDrive, as fotos
  # (que mostram funcionários) sobem para a nuvem da Microsoft junto.
  ativa: true
  pasta: "{AREA_DE_TRABALHO}/Fotos treino EPI"
  recortar_pessoas: true     # salva também o recorte de cada pessoa em <dia>/pessoas/
  intervalo_s: 10            # com alguém na imagem: no máximo 1 foto a cada 10 s por câmera
  sem_pessoa_a_cada_s: 600   # sem ninguém: 1 foto a cada 10 min (ensina que latas não são gente)
  limite_por_dia: 500        # por câmera

painel:
  # 127.0.0.1 = só este PC abre a tela. Use 0.0.0.0 para abrir de outro PC/celular na rede
  # (a tela não tem senha e mostra fotos de funcionários - só libere em rede confiável).
  host: "127.0.0.1"
  porta: 8080

registro:
  pasta: "registros"
  banco: "registros/infracoes.db"
