<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070c16">
  <title>Monitor de EPI</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👷</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg class="helmet" viewBox="0 0 40 40" aria-hidden="true">
        <path d="M6 27c0-9 6-16 14-16s14 7 14 16" fill="#ffd23f" stroke="#0b1424" stroke-width="1.6"/>
        <path d="M17 11.3V8.5c0-.8.7-1.5 1.5-1.5h3c.8 0 1.5.7 1.5 1.5v2.8" fill="#ffd23f" stroke="#0b1424" stroke-width="1.6"/>
        <path d="M13.5 13.5c-1.8 3-2.5 7-2.5 13.5M26.5 13.5c1.8 3 2.5 7 2.5 13.5" fill="none" stroke="#0b1424" stroke-width="1.3" opacity=".55"/>
        <rect x="2" y="26" width="36" height="5" rx="2.5" fill="#ffd23f" stroke="#0b1424" stroke-width="1.6"/>
        <rect x="2" y="33" width="36" height="3" rx="1.5" fill="#ff7a1a"/>
        <rect x="8" y="33" width="5" height="3" fill="#e8ecf3"/><rect x="18" y="33" width="5" height="3" fill="#e8ecf3"/><rect x="28" y="33" width="5" height="3" fill="#e8ecf3"/>
      </svg>
      <div>
        <div class="brand-name">Monitor <em>EPI</em></div>
        <div class="brand-sub">Central de segurança do trabalho</div>
      </div>
    </div>
    <div class="scoreboard" aria-label="Situação">
      <div class="sb-cell"><span class="sb-label">Pessoas</span><span class="sb-value" id="sbPessoas">–</span></div>
      <div class="sb-cell"><span class="sb-label">Sem EPI</span><span class="sb-value" id="sbIrregulares">–</span></div>
      <div class="sb-cell"><span class="sb-label">Infrações hoje</span><span class="sb-value" id="sbHoje">–</span></div>
      <div class="sb-cell"><span class="sb-label">Hora</span><span class="sb-value" id="clock">--:--:--</span></div>
    </div>
  </header>

  <main>
    <section class="panel" aria-label="Situação da área">
      <div class="panel-top">
        <div class="field">
          <span class="field-label">EPIs obrigatórios</span>
          <div class="chips" id="epis"></div>
        </div>
        <div class="field">
          <span class="field-label">Período das infrações</span>
          <div class="segmented" id="periodo" role="radiogroup" aria-label="Período">
            <button role="radio" data-dias="1" aria-checked="true">Hoje</button>
            <button role="radio" data-dias="7" aria-checked="false">7 dias</button>
            <button role="radio" data-dias="30" aria-checked="false">30 dias</button>
            <button role="radio" data-dias="0" aria-checked="false">Tudo</button>
          </div>
        </div>
      </div>
      <div id="statusBar" class="status-bar wait" role="status" aria-live="polite">
        <span class="sig" aria-hidden="true"></span>
        <span class="status-text" id="statusText">Conectando…</span>
        <span class="status-arrow" aria-hidden="true">»</span>
      </div>
      <p class="hint" id="hint">&nbsp;</p>
    </section>

    <div class="section-head">
      <h2>Câmeras</h2>
      <span class="rule"></span>
    </div>
    <section class="cameras">
      <div class="cam" id="cam">
        <div class="screen">
          <img id="video" alt="Vídeo ao vivo da câmera">
          <span class="tag live" id="camTag">Ao vivo</span>
          <span class="tag num">Cam 01</span>
          <span class="cam-name" id="camName"></span>
        </div>
        <div class="cam-info">
          <div class="meter" id="meter" title="Últimas análises: verde = todos com EPI, vermelho = alguém sem EPI"></div>
          <div class="cam-meta"><span id="camMeta"></span><span id="camLat"></span></div>
          <div class="err" id="camErr" hidden></div>
        </div>
      </div>
    </section>

    <div class="section-head">
      <h2>Infrações registradas</h2>
      <span class="rule"></span>
      <span class="count" id="count"></span>
    </div>
    <section id="lista" class="lista"><p class="empty">Carregando…</p></section>
  </main>

  <div id="flash" class="flash"></div>
  <div id="toast" class="toast" hidden></div>
  <div id="viewer" class="viewer" hidden><img alt="Foto da infração"><button class="icon-btn" id="viewerClose">Fechar</button></div>
  <script src="app.js"></script>
</body>
</html>
